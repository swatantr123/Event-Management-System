# ===================================================
# Sports EMS — Combined Backend
# ===================================================
server.port=8080
spring.application.name=sports-ems-combined

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Email (Brevo transactional email HTTP API) ----------
# Sign up free at https://www.brevo.com (300 emails/day, no card needed).
# Get your API key from: Brevo dashboard > Settings > SMTP & API > API Keys
# We use Brevo's HTTP API (not SMTP) because many free hosts, including
# Render's free tier, block outbound SMTP ports (25/465/587).
brevo.api-key=${BREVO_API_KEY:changeme}

# Set to false to disable emails (e.g. while developing without an API key)
app.email.enabled=${EMAIL_ENABLED:true}
app.email.from=${MAIL_FROM:eventmanagement1.team@gmail.com}

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:sportsemssecretkey123456789sportsemssecretkey123456789}
server.error.include-message=always

# ---------- File Upload (Feature 6: organizer/admin verification document) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Folder (relative to where the backend runs) where uploaded PDFs are stored
app.upload.dir=uploads/documents

# ---------- Google Sign-In ----------
# Create an OAuth 2.0 Client ID (Web application) at:
# https://console.cloud.google.com/apis/credentials
# and paste it here AND in frontend/.env as VITE_GOOGLE_CLIENT_ID.
# Used to verify that Google ID tokens were issued for THIS app.
google.oauth.client-id=${GOOGLE_CLIENT_ID:761560125566-mo9fsm3j48gaceb3klqhjcve4hdcadnj.apps.googleusercontent.com}

server.error.include-message=always
